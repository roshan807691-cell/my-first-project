<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit Fashion</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#111;
  color:white;
  text-align:center;
  padding:25px 15px;
}
header h1{font-size:32px}
header p{font-size:18px;margin-top:8px;color:#ddd}

.hero{
  background:linear-gradient(135deg,#222,#444);
  color:white;
  text-align:center;
  padding:55px 20px;
}
.hero h2{font-size:38px;margin-bottom:15px}
.hero p{font-size:20px}

.products{
  padding:30px 15px;
  max-width:1000px;
  margin:auto;
}
.products h2{
  text-align:center;
  font-size:30px;
  margin-bottom:25px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 15px #ccc;
}
.card img{
  width:100%;
  height:330px;
  object-fit:contain;
  background:#eee;
}
.info{padding:20px}
.info h3{font-size:25px}
.price{
  font-size:24px;
  font-weight:bold;
  margin:12px 0;
}
.size{
  padding:10px;
  width:100%;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:8px;
}
.buy{
  display:block;
  width:100%;
  background:#25D366;
  color:white;
  text-align:center;
  padding:14px;
  border-radius:8px;
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}
</style>
</head>

<body>

<header>
  <h1>🛍️ Rohit Fashion</h1>
  <p>Style • Quality • Best Price</p>
</header>

<section class="hero">
  <h2>नई Fashion Collection</h2>
  <p>T-Shirt और Lower अब एक ही जगह</p>
</section>

<section class="products">
  <h2>🔥 हमारे Products</h2>

  <div class="grid">

    <div class="card">
      <img src="tshirt.jpg" alt="Premium T-Shirt">
      <div class="info">
        <h3>Premium T-Shirt</h3>
        <div class="price">₹499</div>

        <select class="size">
          <option>Size चुनें</option>
          <option>M</option>
          <option>L</option>
          <option>XL</option>
          <option>XXL</option>
        </select>

        <a class="buy"
           href="https://wa.me/91XXXXXXXXXX?text=Hello%20Rohit%20Fashion,%20mujhe%20Premium%20T-Shirt%20order%20karni%20hai."
           target="_blank">
          🛒 WhatsApp पर Order करें
        </a>
      </div>
    </div>

    <div class="card">
      <img src="lower.jpg" alt="Premium Lower">
      <div class="info">
        <h3>Premium Lower</h3>
        <div class="price">₹599</div>

        <select class="size">
          <option>Size चुनें</option>
          <option>M</option>
          <option>L</option>
          <option>XL</option>
          <option>XXL</option>
        </select>

        <a class="buy"
           href="https://wa.me/91XXXXXXXXXX?text=Hello%20Rohit%20Fashion,%20mujhe%20Premium%20Lower%20order%20karna%20hai."
           target="_blank">
          🛒 WhatsApp पर Order करें
        </a>
      </div>
    </div>

  </div>
</section>

<footer>
  <p>© 2026 Rohit Fashion</p>
  <p>Quality Fashion at Best Price</p>
</footer>

</body>
</html>
